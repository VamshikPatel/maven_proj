name : Maven Build
-on:
	push:
		branches: ["main"]
	pull_request:
		branches: ["main"]
	jobs:
		build:
			runs-on: ubuntu-latest
			steps:
				- name: checkout source code
				  uses: actions/checkout@v6
				- name: Set up Java
				  uses: actions/setup-java@v5
				  with:
					java-version: "17"
					distribution: 'temurin'
					cache: maven
					-name : Build with Maven
					 run : mvn clean package